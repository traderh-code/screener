name: screener

on:
  schedule:
    # Tous les quarts d'heure, 2 min après la clôture M15 : chaque passage traite les bougies clôturées depuis.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Fenêtre en heures (rejouer les derniers signaux)"
        default: "0.25"

# Un seul passage à la fois : deux passages simultanés enverraient deux fois le même signal.
concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - uses: actions/cache/restore@v4
        with:
          path: state/sent.json
          key: screener-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: screener-state-
      - run: python -m screener.main --hours "$HOURS" --state state/sent.json
        env:
          HOURS: ${{ github.event.inputs.hours || '0.25' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('state/sent.json') != ''
        with:
          path: state/sent.json
          key: screener-state-${{ github.run_id }}-${{ github.run_attempt }}
      # En shell : doit marcher même si l'installation Python a échoué. Un message au début et à la fin de la panne, pas à chaque passage.
      - name: Alerte de panne
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow screener.yml --limit 20 --json databaseId,conclusion \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.conclusion == \"success\" or .conclusion == \"failure\"))][0].conclusion" || true)
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          text=""
          if [ "$STATUS" != "success" ] && [ "$prev" != "failure" ]; then
            text="⚠️ Screener en panne : plus aucune alerte garantie tant qu'il n'est pas rétabli. $url"
          elif [ "$STATUS" = "success" ] && [ "$prev" = "failure" ]; then
            text="✅ Screener rétabli. Les signaux de plus de 3 h pendant la panne sont perdus."
          fi
          echo "statut=$STATUS precedent=$prev message=${text:+oui}"
          if [ -n "$text" ]; then
            curl -sS -o /dev/null --fail-with-body "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$text"
          fi
