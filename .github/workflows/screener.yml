name: screener

on:
  schedule:
    # Tous les quarts d'heure, 2 min après la clôture M15 : chaque passage traite les bougies clôturées depuis.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Fenêtre en heures (rejouer les derniers signaux)"
        default: "0.25"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m screener.main --hours "$HOURS"
        env:
          HOURS: ${{ github.event.inputs.hours || '0.25' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
